definitions:
  comm.HttpResult:
    properties:
      code:
        allOf:
        - $ref: '#/definitions/pb.ErrorCode'
        description: |-
          错误代码
          @Description 响应结果的错误码 0 表示成功
          @example 0
        example: 0
      data:
        description: |-
          数据部分，可能是多种类型
          @Description 响应的数据，类型可变
          @oneOf User Product Order
          @example {"id": 1, "name": "John Doe"}
      msg:
        description: |-
          消息说明
          @Description 响应结果的消息 请求返回的描述信息
          @example "Success"
        example: Success
        type: string
    type: object
  pb.AgentInfo:
    properties:
      agent_id:
        description: '@go_tags(`json:"agent_id"`) 智能体id'
        type: string
      description:
        description: '@go_tags(`json:"description"`) 智能体描述'
        type: string
      name:
        description: '@go_tags(`json:"name"`) 智能体名称'
        type: string
      type:
        description: '@go_tags(`json:"type"`) 智能体类型'
        type: string
    type: object
  pb.AgentSource:
    description: 智能体来源
    enum:
    - 0
    - 1
    - 2
    - 3
    type: integer
    x-enum-comments:
      AgentSource_AgentSourceAliyun: 阿里云平台
      AgentSource_AgentSourceBuiltin: 内置智能体
      AgentSource_AgentSourcePolyChat: PolyChat 平台
      AgentSource_AgentSourceVolcano: 火山平台
    x-enum-varnames:
    - AgentSource_AgentSourceBuiltin
    - AgentSource_AgentSourcePolyChat
    - AgentSource_AgentSourceAliyun
    - AgentSource_AgentSourceVolcano
