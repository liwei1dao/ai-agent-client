        type: string
      required:
        description: '@go_tags(`json:"required"`) 是否必填'
        type: boolean
      type:
        description: '@go_tags(`json:"type"`) 变量类型'
        type: string
    type: object
  pb.AgentsGetAgentUrlReq:
