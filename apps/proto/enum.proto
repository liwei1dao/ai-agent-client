// 区域枚举，用于根据区域适配服务配置
enum Region {
    // 未知区域
    // @Description 未知区域
    // @example
    RegionUnknown = 0;          //未知区域
    // 中国（独立处理）
    // @Description 中国
    // @example
    RegionChina = 1;            //中国
    // 美国（独立处理）
    // @Description 美国
    // @example
    RegionUSA = 2;              //美国
    // 东亚（日韩蒙等，不含中国）
    // @Description 东亚
    // @example
    RegionEastAsia = 3;         //东亚
    // 东南亚
    // @Description 东南亚
    // @example
    RegionSoutheastAsia = 4;    //东南亚
    // 南亚
    // @Description 南亚
    // @example
    RegionSouthAsia = 5;        //南亚
    // 西亚/中东
    // @Description 西亚/中东
    // @example
    RegionMiddleEast = 6;       //西亚/中东
    // 欧洲
    // @Description 欧洲
    // @example
    RegionEurope = 7;           //欧洲
    // 俄罗斯（独立处理）
    // @Description 俄罗斯
    // @example
    RegionRussia = 8;           //俄罗斯
    // 非洲
    // @Description 非洲
    // @example
    RegionAfrica = 9;           //非洲
    // 南美洲
    // @Description 南美洲
    // @example
    RegionSouthAmerica = 10;    //南美洲
    // 北美洲（加拿大、墨西哥等，不含美国）
    // @Description 北美洲
    // @example
    RegionNorthAmerica = 11;    //北美洲
    // 大洋洲
    // @Description 大洋洲
    // @example
    RegionOceania = 12;         //大洋洲
    // 巴西（独立处理）
    // @Description 巴西
    // @example
    RegionBrazil = 13;          //巴西
    // 印度（独立处理）
    // @Description 印度
    // @example
    RegionIndia = 14;           //印度
}
