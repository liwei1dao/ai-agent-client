<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 — UniHelper 管理后台</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <div class="lm">🤖</div>
      <h1>UniHelper 管理后台</h1>
      <p>Console · 服务与 Agent 配置中心</p>
    </div>

    <!-- 对接：POST /web/api/api_login  { account, password } -->
    <div class="login-field">
      <label class="form-label">账号</label>
      <div class="login-input">
        <span class="ic">👤</span>
        <input type="text" value="admin" placeholder="请输入账号">
      </div>
    </div>

    <div class="login-field">
      <label class="form-label">密码</label>
      <div class="login-input">
        <span class="ic">🔒</span>
        <input type="password" value="••••••••" placeholder="请输入密码">
        <span class="ic" style="cursor:pointer">👁</span>
      </div>
    </div>

    <div style="display:flex; align-items:center; justify-content:space-between; margin:6px 0 22px; font-size:13px;">
      <label class="dot"><span class="switch on" style="transform:scale(.8)"></span> <span style="color:var(--text-2)">记住登录</span></label>
      <a href="#" style="color:var(--primary); text-decoration:none;">忘记密码？</a>
    </div>

    <a href="services.html" class="btn primary lg">登 录</a>

    <div class="login-foot">
      登录成功后返回 JWT（HS256，24h），写入 <code>Authorization</code> 头<br>
      角色：1 超管 · 2 管理员 · 3 代理商 · 4 运营
    </div>
  </div>
</div>
</body>
</html>
